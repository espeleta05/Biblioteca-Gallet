# SIGEB · API Gateway (Propuesta 3.1 nivel 2 y 3.2: NGINX).
# Punto único de acceso: valida identidad y rol de cada petición con el
# microservicio de usuarios (auth_request) y la enruta al microservicio de la
# función del Product Backlog correspondiente. Solo HTTPS (Propuesta 3.2).

upstream web                 { server web:3000; }
upstream usuarios            { server usuarios:4001; }
upstream gestionar_libros    { server gestionar-libros:4002; }
upstream buscar_libros       { server buscar-libros:4003; }
upstream prestar_libros      { server prestar-libros:4004; }
upstream devolver_libros     { server devolver-libros:4005; }
upstream gestion_multas      { server gestion-multas:4006; }
upstream alumnos_suspendidos { server alumnos-suspendidos:4007; }
upstream chatbot             { server chatbot:4008; }

# Límite de intentos de inicio de sesión por IP (complementa el bloqueo tras 5 intentos).
limit_req_zone $binary_remote_addr zone=sesion:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name biblioteca.ducky.edu.mx localhost;

    ssl_certificate     /etc/nginx/certs/sigeb.crt;
    ssl_certificate_key /etc/nginx/certs/sigeb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;
    proxy_read_timeout 5s;   # RNF: respuesta ≤ 3 s; se corta lo que se cuelga.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Validación de identidad y rol (subpetición interna al servicio de usuarios).
    location = /_verificar {
        internal;
        proxy_pass http://usuarios/api/auth/verificar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Respuestas de error del gateway con el mismo formato JSON que los servicios.
    error_page 401 = @no_autenticado;
    error_page 403 = @sin_permiso;
    error_page 502 503 504 = @no_disponible;
    location @no_autenticado { default_type application/json; return 401 '{"error":"Debes iniciar sesión."}'; }
    location @sin_permiso    { default_type application/json; return 403 '{"error":"Tu rol no tiene acceso a esta función."}'; }
    location @no_disponible  { default_type application/json; return 503 '{"error":"El servicio no está disponible en este momento. Intenta de nuevo."}'; }

    # Sesión: pública (iniciar, consultar y cerrar sesión).
    location = /api/auth/sesion { limit_req zone=sesion burst=5 nodelay; proxy_pass http://usuarios; }

    # Gestión de usuarios (Sprint 0)
    location /api/usuarios          { auth_request /_verificar; proxy_pass http://usuarios; }
    # Gestionar libros y Buscar libros (Sprint 1)
    location /api/libros            { auth_request /_verificar; proxy_pass http://gestionar_libros; }
    location /api/solicitudes-compra { auth_request /_verificar; proxy_pass http://gestionar_libros; }
    location /api/busqueda          { auth_request /_verificar; proxy_pass http://buscar_libros; }
    # Prestar y Devolver libros (Sprint 2)
    location /api/prestamos         { auth_request /_verificar; proxy_pass http://prestar_libros; }
    location /api/lista-espera      { auth_request /_verificar; proxy_pass http://prestar_libros; }
    location /api/recibos           { auth_request /_verificar; proxy_pass http://prestar_libros; }
    location /api/devoluciones      { auth_request /_verificar; proxy_pass http://devolver_libros; }
    # Gestión de multas y Alumnos suspendidos (Sprint 3)
    location /api/multas            { auth_request /_verificar; proxy_pass http://gestion_multas; }
    location /api/adeudos           { auth_request /_verificar; proxy_pass http://gestion_multas; }
    location /api/tipo-cambio       { auth_request /_verificar; proxy_pass http://gestion_multas; }
    location /api/suspensiones      { auth_request /_verificar; proxy_pass http://alumnos_suspendidos; }
    # Chatbot (Sprint 4)
    location /api/chatbot           { auth_request /_verificar; proxy_pass http://chatbot; }

    # Cualquier otra ruta de API no existe.
    location /api/ { default_type application/json; return 404 '{"error":"La ruta no existe."}'; }

    # Aplicación web (React + TypeScript) para administradores y bibliotecarios.
    location / { proxy_pass http://web; }
}
