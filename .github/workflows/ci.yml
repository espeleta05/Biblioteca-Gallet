# Integración continua (Propuesta 3.2: GitHub Actions). Automatiza lo mecánico
# (Google cap. 9): tipos, pruebas unitarias e integración y build en cada cambio.
name: CI

on:
  push:
  pull_request:

jobs:
  servicios:
    name: Microservicios (tipos + pruebas)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sigeb
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sigeb
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U sigeb" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: servicios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: servicios/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --runInBand --coverage
        env:
          DATABASE_URL: postgres://sigeb@localhost:55432/sigeb
          JWT_SECRET: secreto-de-pruebas-ci-0123456789-abcdefghij
      - run: npm run build

  web:
    name: Aplicación web (tipos + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  movil:
    name: App móvil (tipos)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app-movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app-movil/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
