# SIGEB · Despliegue con Docker Compose (Propuesta 3.2 y 3.4).
# Uso:   cp .env.example .env   (y completa los valores)
#        sh infra/nginx/generar-certificado-dev.sh   (solo ambiente de pruebas)
#        docker compose up -d --build
# Web:   https://localhost   ·   API: https://localhost/api/...

x-servicio: &servicio
  build: ./servicios
  restart: unless-stopped
  env_file: .env
  environment: &entorno
    # Misma zona que la base de datos: las fechas y horas (TIMESTAMP) se leen sin desfase.
    TZ: America/Monterrey
    DATABASE_URL: postgres://sigeb:${POSTGRES_PASSWORD}@db:5432/sigeb
    URL_USUARIOS: http://usuarios:4001
    URL_PRESTAR_LIBROS: http://prestar-libros:4004
    URL_ALUMNOS_SUSPENDIDOS: http://alumnos-suspendidos:4007
    URL_BD_ESCOLAR: ${URL_BD_ESCOLAR:-http://simulador-escolar:4101}
    URL_TESORERIA: ${URL_TESORERIA:-http://simulador-tesoreria:4102}
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    # CURRENT_DATE debe ser la fecha de la biblioteca, no la de UTC (si no, después de las
    # 6 p.m. las fechas de vencimiento y de multas se corren un día).
    command: ["postgres", "-c", "timezone=America/Monterrey"]
    environment:
      POSTGRES_DB: sigeb
      POSTGRES_USER: sigeb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - datos-sigeb:/var/lib/postgresql/data
      - ./db/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./db/datos-base.sql:/docker-entrypoint-initdb.d/02-datos-base.sql:ro
      # Pruebas: datos-prueba.sql. Producción: DATOS_PRUEBA=sin-datos-prueba.sql en .env.
      - ./db/${DATOS_PRUEBA:-datos-prueba.sql}:/docker-entrypoint-initdb.d/03-datos-prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigeb -d sigeb"]
      interval: 5s
      retries: 10

  # Un contenedor por función del Product Backlog.
  usuarios:            { <<: *servicio, environment: { <<: *entorno, SERVICIO: usuarios } }
  gestionar-libros:    { <<: *servicio, environment: { <<: *entorno, SERVICIO: gestionar-libros } }
  buscar-libros:       { <<: *servicio, environment: { <<: *entorno, SERVICIO: buscar-libros } }
  prestar-libros:      { <<: *servicio, environment: { <<: *entorno, SERVICIO: prestar-libros } }
  devolver-libros:     { <<: *servicio, environment: { <<: *entorno, SERVICIO: devolver-libros } }
  gestion-multas:      { <<: *servicio, environment: { <<: *entorno, SERVICIO: gestion-multas } }
  alumnos-suspendidos: { <<: *servicio, environment: { <<: *entorno, SERVICIO: alumnos-suspendidos } }
  # El chatbot usa Llama (Ollama) para las preguntas abiertas; si no responde, su clasificador local.
  chatbot:             { <<: *servicio, environment: { <<: *entorno, SERVICIO: chatbot, URL_OLLAMA: "${URL_OLLAMA:-http://ollama:11434}", MODELO_OLLAMA: "${MODELO_OLLAMA:-llama3.2:3b}" } }

  # Motor de lenguaje del chatbot: Llama 3.2 en Ollama, dentro del servidor (ADR 0003).
  # Solo es accesible desde la red interna de Docker; los datos no salen del servidor.
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"     # el modelo se queda cargado en memoria todo el día
      OLLAMA_NUM_PARALLEL: "1"     # sin GPU, una pregunta a la vez usa todo el procesador
    volumes:
      - modelos-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 10

  # Descarga el modelo la primera vez (2 GB) y termina; las siguientes veces no hace nada.
  ollama-modelo:
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["ollama", "pull", "${MODELO_OLLAMA:-llama3.2:3b}"]
    restart: "no"
    depends_on:
      ollama: { condition: service_healthy }

  # Ambiente de pruebas: sustituyen a los sistemas de la Universidad. En
  # producción se quitan y URL_BD_ESCOLAR / URL_TESORERIA apuntan a los reales.
  simulador-escolar:
    build: ./servicios
    environment: { SERVICIO: simuladores, SIMULADOR: escolar, PORT: "4101" }
    profiles: ["pruebas"]
  simulador-tesoreria:
    build: ./servicios
    environment: { SERVICIO: simuladores, SIMULADOR: tesoreria, PORT: "4102" }
    profiles: ["pruebas"]

  web:
    build: .
    restart: unless-stopped
    depends_on: [usuarios]

  gateway:
    image: nginx:1.27.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/sigeb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on: [web, usuarios, gestionar-libros, buscar-libros, prestar-libros, devolver-libros, gestion-multas, alumnos-suspendidos, chatbot]

  # Respaldo automático diario con 30 días de retención (Propuesta 3.3).
  # RUTA_RESPALDOS debe apuntar a un equipo distinto al servidor (Propuesta 3.4).
  respaldos:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: sigeb
      PGDATABASE: sigeb
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENCION_DIAS: "30"
    volumes:
      - ./infra/respaldos:/scripts:ro
      - ${RUTA_RESPALDOS:-./respaldos}:/respaldos
    entrypoint: ["sh", "-c", "while true; do sh /scripts/respaldar.sh; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  datos-sigeb:
  modelos-ollama:
